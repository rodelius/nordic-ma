name: Verify pilot and demo
on:
  pull_request:
  push:
    branches: [main, production-pilot-stage-1, production-pilot-stage-2, ficc-feedback-engine, fix-review-persistence, guided-review, corporate-event-model, easier-manual-review, mobile-review-timestamps, evidence-extraction]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run test:api
      - run: npm run test:pilot
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile demo
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npm run test:e2e 2>&1 | tee browser-tests.log
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
            browser-tests.log
          retention-days: 7
